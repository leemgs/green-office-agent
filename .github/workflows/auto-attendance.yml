name: Auto Attendance

on:
  schedule:
    # 출석 가능 시간: 평일 06:00~11:00 KST (= 전날 21:00 ~ 당일 02:00 UTC)
    #
    # GitHub Actions의 예약 실행(schedule)은 수십 분~수 시간 지연될 수 있고, 특히 정각(:00)은
    # 혼잡이 가장 심해 지연이 커진다. 과거 단일 예약(07:00 KST / '0 22')이 지연으로 11:00을
    # 넘겨 사이트에 거부당했다(출석 창을 벗어남). 그래서:
    #   (1) 정각을 피해 오프피크 분(:17)에 예약하고,
    #   (2) 창 초반에 여러 번 예약해 일부가 지연돼도 적어도 하나는 창 안에 들도록 중복 예약한다.
    # 봇은 이미 출석했으면 '출석 완료'를 감지해 건너뛰므로(멱등) 중복 실행은 안전하다.
    # 또한 창을 벗어난 지연 실행은 하드 실패 대신 조용히 건너뛴다(bot.js handleAttendance).
    #
    # UTC 기준 요일 주의: 전날 21~23시 UTC는 KST 평일에 해당하는 UTC 요일이 일~목(0-4),
    #                    당일 00~01시 UTC는 월~금(1-5)이다.
    - cron: '17 21 * * 0-4'   # 06:17 KST
    - cron: '17 22 * * 0-4'   # 07:17 KST
    - cron: '17 23 * * 0-4'   # 08:17 KST
    - cron: '17 0 * * 1-5'    # 09:17 KST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  attendance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Run Attendance (06:17~09:17 KST Mon-Fri, retry windows)
        run: |
          set -o pipefail
          node index.js attendance 2>&1 | tee attendance.log
        env:
          USER_ID: ${{ secrets.USER_ID || vars.USER_ID }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD || vars.USER_PASSWORD }}
          SITE_URL: https://green-office.uk/

      - name: Create Issue on Attendance Failure
        if: failure()
        run: |
          KST_TIME=$(TZ=Asia/Seoul date "+%Y-%m-%d %H:%M")
          
          TITLE="$KST_TIME 출석 체크 실패했습니다."
          
          echo "### ⚠️ 출석 체크 실패" > issue_body.md
          echo "" >> issue_body.md
          echo "#### 📋 상세 실행 로그:" >> issue_body.md
          echo "\`\`\`text" >> issue_body.md
          if [ -f attendance.log ]; then
            cat attendance.log >> issue_body.md
          else
            echo "로그 파일을 찾을 수 없습니다." >> issue_body.md
          fi
          echo "\`\`\`" >> issue_body.md
          
          gh issue create --title "$TITLE" --body-file issue_body.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
